<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 450" width="400" height="450" role="img" aria-label="Infinity Construction &amp; Developers logo">
  <defs>
    <style>
      .logo-path {
        fill: none;
        stroke: #ffffff;
        stroke-width: 14;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-dasharray: 2200;
        stroke-dashoffset: 2200;
        animation: drawLogo 1.6s cubic-bezier(0.4, 0, 0.2, 1) forwards;
      }
      .window {
        fill: #e08a2c;
        opacity: 0;
        transform-origin: center;
        animation: popWindow 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
      }
      .window-1 { animation-delay: 1.05s; }
      .window-2 { animation-delay: 1.15s; }
      .window-3 { animation-delay: 1.25s; }

      @keyframes drawLogo {
        0% { stroke-dashoffset: 2200; }
        100% { stroke-dashoffset: 0; }
      }

      @keyframes popWindow {
        0% { opacity: 0; transform: scale(0); }
        100% { opacity: 1; transform: scale(1); }
      }

      @media (prefers-reduced-motion: reduce) {
        .logo-path { animation: none; stroke-dashoffset: 0; }
        .window { animation: none; opacity: 1; transform: scale(1); }
      }
    </style>
  </defs>

  <path class="logo-path" d="
    M 200,320
    C 150,375 70,395 70,320
    C 70,245 150,265 200,320
    C 250,375 330,395 330,320
    C 330,245 250,265 200,320
    L 200,75
    L 265,30
    L 265,320
    M 200,135
    L 135,170
    L 135,242
  " />

  <rect class="window window-1" x="223" y="90" width="18" height="12" rx="2" />
  <rect class="window window-2" x="223" y="130" width="18" height="12" rx="2" />
  <rect class="window window-3" x="223" y="170" width="18" height="12" rx="2" />
</svg>
